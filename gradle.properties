# Every field used in mod metadata must also be listed in the expandProps map
# of buildSrc/src/main/groovy/multiloader-common.gradle.

# Project
version=0.2.0
group=io.lakio.farfield
java_version=21

# Mod
mod_id=farfield
mod_name=Farfield
mod_author=Lakio
license=LGPL-3.0-only
credits=
description=Far-distance terrain rendering with levels of detail.

# Minecraft
minecraft_version=1.21.1
minecraft_version_range=[1.21.1, 1.21.2)
## NeoForm version used by the 'common' project: https://projects.neoforged.net/neoforged/neoform
neo_form_version=1.21.1-20240808.144430
## Parchment parameter names: https://parchmentmc.org/docs/getting-started#choose-a-version
parchment_minecraft=1.21
parchment_version=2024.11.10

# Fabric
fabric_version=0.109.0+1.21.1
fabric_loader_version=0.16.9
## Mod Menu, optional, opens the settings screen: https://modrinth.com/mod/modmenu/versions
modmenu_version=11.0.3

# NeoForge: the version of the pack runPackClient loads (ADR-097); its Forgified Fabric
# API needs 21.1.248. The shipped jar accepts any 21.1 (neoforge.mods.toml).
neoforge_version=21.1.248
neoforge_loader_version_range=[4,)

# Tests and benchmarks
junit_version=5.11.3
lz4_java_version=1.8.0
jmh_version=1.37
zstd_jni_version=1.5.6-3
lmdbjava_version=0.9.0
aircompressor_version=0.27

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
