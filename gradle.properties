# Every field used in mod metadata must also be listed in the expandProps map
# of buildSrc/src/main/groovy/multiloader-common.gradle.

# Project
version=1.1.0
group=io.lakio.farfield
java_version=21

# Mod
mod_id=farfield
mod_name=Farfield
mod_author=Lakio
license=LGPL-3.0-only
credits=
description=Far-distance terrain rendering with levels of detail.

# Minecraft: the versions built (ADR-165), each with its properties in
# versions/<minecraft version>.properties.
minecraft_versions=1.21.1,1.21.11

# Fabric
# The dev runtime: as recent as the user's Fabric pack needs (Cobblemon asks
# loader 0.17.2, Sodium Extra loader 0.18).
fabric_loader_version=0.19.5
# The oldest loader the shipped jar accepts (fabric.mod.json).
fabric_loader_min=0.16.9

# NeoForge
neoforge_loader_version_range=[4,)

# Tests and benchmarks
junit_version=5.11.3
lz4_java_version=1.8.0
jmh_version=1.37
zstd_jni_version=1.5.6-3
lmdbjava_version=0.9.0
aircompressor_version=0.27

# Gradle
# Stonecutter with Groovy build scripts (ADR-165): its warning acknowledged.
dev.kikugie.stonecutter.hard_mode=true
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
