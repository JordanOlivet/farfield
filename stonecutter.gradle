import groovy.json.JsonSlurper

import java.security.MessageDigest

// The root build file is Stonecutter's controller (ADR-165): the line
// `stonecutter.active` names the Minecraft version the shared sources are
// written for now; its tasks switch them to another version.
plugins {
    id 'dev.kikugie.stonecutter'
    // see https://fabricmc.net/develop/ for new versions. One jar, two plugins: Loom
    // with remapping for the obfuscated versions (1.21.x), without from 26.1 (ADR-171).
    // Loom 1.19 runs on Java 25 and Gradle 9.8+ (gradle/gradle-daemon-jvm.properties).
    id 'net.fabricmc.fabric-loom' version '1.19.4' apply false
    // see https://projects.neoforged.net/neoforged/moddevgradle for new versions
    id 'net.neoforged.moddev' version '2.0.148' apply false
    // Toolchains for the vanilla server below (the game's JDK: 21, 25 from 26.1).
    id 'jvm-toolchains'
}

stonecutter.active '1.21.1'

// Renames between versions, applied to the whole source of a node (ADR-165): the
// sources are written for 1.21.1 (the active version), and these turn its names into
// a later version's. A rename here must be one to one, and its new name absent from
// the 1.21.1 sources, since switching the active version applies it backwards too.
// Anything else goes in Stonecutter comments or a compat class.
stonecutter.parameters { sc ->
    def atLeast = { String version -> sc.compare(sc.current.version, version) >= 0 }
    // 1.21.2: the level's height accessors and registry lookups.
    sc.replacements.string(atLeast('1.21.2')) { r ->
        r.replace('getMinBuildHeight()', 'getMinY()')
        r.replace('getMaxBuildHeight()', 'getMaxY() + 1')
        r.replace('getMinSection()', 'getMinSectionY()')
        r.replace('registryOrThrow(', 'lookupOrThrow(')
    }
    // 1.21.5: the OpenGL state manager moves with the GPU device's OpenGL backend.
    // (26.3 moves it again, below: two replacements of one name do not chain.)
    sc.replacements.string(atLeast('1.21.5') && !atLeast('26.3')) { r ->
        r.replace('com.mojang.blaze3d.platform.GlStateManager', 'com.mojang.blaze3d.opengl.GlStateManager')
    }
    // 26.3: the GPU API moves into Renderpearl, its OpenGL backend apart (ADR-171).
    sc.replacements.string(atLeast('26.3')) { r ->
        r.replace('com.mojang.blaze3d.platform.GlStateManager', 'com.mojang.renderpearl.backend.opengl.GlStateManager')
        r.replace('com.mojang.blaze3d.opengl.', 'com.mojang.renderpearl.backend.opengl.')
        r.replace('com.mojang.blaze3d.systems.GpuDeviceBackend', 'com.mojang.renderpearl.backend.api.GpuDeviceBackend')
        r.replace('com.mojang.blaze3d.pipeline.ColorTargetState', 'com.mojang.renderpearl.api.pipeline.ColorTargetState')
        r.replace('com.mojang.blaze3d.textures.', 'com.mojang.renderpearl.api.textures.')
        r.replace('com.mojang.blaze3d.buffers.', 'com.mojang.renderpearl.api.buffers.')
    }
    // 1.21.11: ResourceLocation becomes Identifier, ResourceKey.location() identifier().
    sc.replacements.string(atLeast('1.21.11')) { r ->
        r.replace('ResourceLocation', 'Identifier')
        r.replace('.location()', '.identifier()')
        // The camera's accessors, and the compiled check that waits for a section's fade-in.
        r.replace('camera.getPosition()', 'camera.position()')
        r.replace('camera.getBlockPosition()', 'camera.blockPosition()')
        r.replace('.getLookVector()', '.forwardVector()')
    }
    // 26.3: a section's visibility takes the fade's duration (the Chunk Fade option, ADR-170).
    sc.replacements.string(atLeast('26.3')) { r ->
        r.replace('s.getVisibility(net.minecraft.util.Util.getMillis())',
                's.getVisibility(net.minecraft.util.Util.getMillis(), GlCompat.chunkFadeMillis(mc))')
        // The preliminary surface is the chunk surface level, interpolated over 16 blocks.
        r.replace('router.preliminarySurfaceLevel()', 'router.chunkSurfaceLevel()')
        // A biome from a resolver, the cell height a constant, the noises an interface.
        r.replace('d.biomes.getNoiseBiome(', 'Mc.noiseBiome(d.biomes, ')
        r.replace('d.noise.getCellHeight()', 'Mc.cellHeight(d.noise)')
        r.replace('final NormalNoise icebergPillar', 'final net.minecraft.world.level.levelgen.synth.Noise icebergPillar')
        r.replace('final NormalNoise icebergSurface', 'final net.minecraft.world.level.levelgen.synth.Noise icebergSurface')
        r.replace('icebergSurface.getValue(', 'icebergSurface.get(')
        r.replace('icebergPillar.getValue(', 'icebergPillar.get(')
        r.replace('icebergPillarRoof.getValue(', 'icebergPillarRoof.get(')
        // The density functions move to a package of their own (and are compiled to samplers).
        r.replace('net.minecraft.world.level.levelgen.DensityFunction', 'net.minecraft.world.level.levelgen.densityfunction.DensityFunction')
        // Iris 1.11.7: the DH program patch takes a set of names more (none here).
        r.replace('vertex, null, null, null, fragment, iris.getTextureMap());',
                'vertex, null, null, null, fragment, iris.getTextureMap(), java.util.Set.of());')
    }
    // 26.1: block models move to their own packages, the GUI draws through an extractor
    // of render state, the tint getter is the client's (ADR-171).
    sc.replacements.string(atLeast('26.1')) { r ->
        r.replace('net.minecraft.client.renderer.block.model.BakedQuad', 'net.minecraft.client.resources.model.geometry.BakedQuad')
        r.replace('net.minecraft.client.renderer.block.model.BlockStateModel', 'net.minecraft.client.renderer.block.dispatch.BlockStateModel')
        r.replace('net.minecraft.client.renderer.block.model.BlockModelPart', 'net.minecraft.client.renderer.block.dispatch.BlockStateModelPart')
        r.replace('BlockModelPart', 'BlockStateModelPart')
        r.replace('net.minecraft.world.level.BlockAndTintGetter', 'net.minecraft.client.renderer.block.BlockAndTintGetter')
        r.replace('GuiGraphics', 'GuiGraphicsExtractor')
        r.replace('renderMenuBackground(', 'extractMenuBackground(')
        r.replace('tabNavigationBar.setWidth(', 'tabNavigationBar.updateWidth(')
        // Chunk positions are a record, packed rather than turned into a long.
        r.replace('ChunkPos.asLong(', 'ChunkPos.pack(')
        r.replace('.getPos().toLong()', '.getPos().pack()')
        r.replace('level.getDayTime()', 'level.getOverworldClockTime()')
        r.replace('SnowyDirtBlock.SNOWY', 'SnowyBlock.SNOWY')
        // The color mask is a bit mask of the targets' channels (ColorTargetState's WRITE_ALL, WRITE_NONE:
        // the values, since 26.3 moves the class and two replacements of one name do not chain).
        r.replace('_colorMask(true, true, true, true)', '_colorMask(15)')
        r.replace('_colorMask(false, false, false, false)', '_colorMask(0)')
    }
    // Fabric API for 26.1: key mappings by the game's name, payload registries by direction, and
    // the chunk load event tells whether the chunk is new.
    sc.replacements.string(atLeast('26.1')) { r ->
        r.replace('fabric.api.client.keybinding.v1.KeyBindingHelper', 'fabric.api.client.keymapping.v1.KeyMappingHelper')
        r.replace('KeyBindingHelper.registerKeyBinding(', 'KeyMappingHelper.registerKeyMapping(')
        r.replace('PayloadTypeRegistry.playC2S()', 'PayloadTypeRegistry.serverboundPlay()')
        r.replace('PayloadTypeRegistry.playS2C()', 'PayloadTypeRegistry.clientboundPlay()')
        r.replace('ServerChunkEvents.CHUNK_LOAD.register(LodServer::onChunkLoad)',
                'ServerChunkEvents.CHUNK_LOAD.register((level, chunk, isNew) -> LodServer.onChunkLoad(level, chunk))')
    }
    // 26.2: the open screen is the GUI's, the main target and camera the game renderer's,
    // blending per color target, menu tab bars of their own (ADR-171).
    sc.replacements.string(atLeast('26.2')) { r ->
        r.replace('mc.setScreen(', 'mc.gui.setScreen(')
        r.replace('minecraft.setScreen(', 'minecraft.gui.setScreen(')
        r.replace('mc.screen instanceof', 'mc.gui.screen() instanceof')
        r.replace('minecraft.screen == null', 'minecraft.gui.screen() == null')
        r.replace('Minecraft.getInstance().getMainRenderTarget()', 'Minecraft.getInstance().gameRenderer.mainRenderTarget()')
        r.replace('gameRenderer.getMainCamera()', 'gameRenderer.mainCamera()')
        r.replace('_enableBlend()', '_enableBlend(0)')
        r.replace('_disableBlend()', '_disableBlend(0)')
        r.replace('BlockTags.SAPLINGS', 'net.minecraft.tags.BlockItemTags.SAPLINGS.block()')
        r.replace('TabNavigationBar', 'MenuTabBar')
    }
    // NeoForge 21.11 (FML 10): the environment's getters, the client's own packet distributor.
    sc.replacements.string(atLeast('1.21.11')) { r ->
        r.replace('FMLEnvironment.dist', 'FMLEnvironment.getDist()')
        r.replace('FMLEnvironment.production', 'FMLEnvironment.isProduction()')
        r.replace('PacketDistributor.sendToServer(', 'net.neoforged.neoforge.client.network.ClientPacketDistributor.sendToServer(')
    }
}

// The active version's properties (versions/<version>.properties), for the
// vanilla server below and the dev task aliases of the loader projects.
// -Pmc=<version> picks another version, as for the loader projects' dev tasks.
def activeVersion = (findProperty('mc') ?: stonecutter.current.project) as String
def activeProperties = new Properties()
file("versions/${activeVersion}.properties").withReader('UTF-8') { activeProperties.load(it) }
ext.activeMinecraftVersion = activeVersion
def minecraft_version = activeProperties.getProperty('minecraft_version')

// Vanilla server for client mode checks (E.6, ADR-042): Mojang's server jar,
// run dir runs/vanilla-server (gitignored, runs/vanilla-server-<version> for a
// version other than 1.21.1, so each upgrades its own copy of the test world),
// set up from dev/server.
def vanillaServerDir = file(minecraft_version == '1.21.1' ? 'runs/vanilla-server' : "runs/vanilla-server-${minecraft_version}")

tasks.register('setupVanillaServer') {
    group = 'farfield'
    description = "Downloads the vanilla ${minecraft_version} server jar and copies the missing dev/server templates."
    doLast {
        def jar = new File(vanillaServerDir, 'server.jar')
        if (!jar.exists()) {
            def json = new JsonSlurper()
            def manifest = json.parse(new URL('https://piston-meta.mojang.com/mc/game/version_manifest_v2.json'))
            def version = manifest.versions.find { it.id == minecraft_version }
            if (version == null) {
                throw new GradleException("Minecraft ${minecraft_version} is not in Mojang's version manifest")
            }
            def server = json.parse(new URL(version.url)).downloads.server
            def part = new File(vanillaServerDir, 'server.jar.part')
            part.parentFile.mkdirs()
            new URL(server.url).withInputStream { input -> part.withOutputStream { it << input } }
            def sha1 = MessageDigest.getInstance('SHA-1').digest(part.bytes).encodeHex().toString()
            if (sha1 != server.sha1) {
                part.delete()
                throw new GradleException("Vanilla server jar: SHA-1 ${sha1}, expected ${server.sha1}")
            }
            part.renameTo(jar)
            logger.lifecycle("Downloaded the vanilla ${minecraft_version} server to ${relativePath(jar)}")
        }
        DevTemplates.copyMissing(file('dev/server'), vanillaServerDir).each {
            logger.lifecycle("Created ${relativePath(it)} from dev/")
        }
    }
}

// Reads console commands from stdin, as the dev servers.
tasks.register('runVanillaServer', Exec) {
    group = 'farfield'
    description = "Runs the vanilla ${minecraft_version} server in runs/vanilla-server."
    dependsOn 'setupVanillaServer'
    workingDir vanillaServerDir
    standardInput = System.in
    def java = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(activeProperties.getProperty('java_version') ?: java_version)
    }
    doFirst {
        commandLine java.get().executablePath.asFile.absolutePath, '-Xmx2G', '-jar', 'server.jar', 'nogui'
    }
}
