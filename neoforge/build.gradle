plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

neoForge {
    version = neoforge_version
    // Automatically enable neoforge AccessTransformers if the file exists
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        configureEach {
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        client {
            client()
            // Scripted checks: -PquickPlay=<save name> opens that world directly.
            if (project.hasProperty('quickPlay')) {
                programArguments.addAll('--quickPlaySingleplayer', project.property('quickPlay') as String)
            }
        }
        server {
            server()
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // Libraries of the engine core, nested in the mod jar.
    jarJar(implementation("io.airlift:aircompressor")) {
        version {
            strictly "[${aircompressor_version},)"
            prefer aircompressor_version
        }
    }
    additionalRuntimeClasspath "io.airlift:aircompressor:${aircompressor_version}"
}

// Dev servers read console commands (scripted checks pipe them in).
tasks.matching { it.name == 'runServer' }.configureEach {
    standardInput = System.in
}
