// Convention for the pure Java projects (api, core): no Minecraft on the
// classpath, JUnit 5 tests, and their sources exported so the loader projects
// compile them into the mod jar (same mechanism as 'common').
plugins {
    id 'java-library'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
}

// Java 17 bytecode and API: Minecraft 1.20.1 runs Java 17, and its nodes depend
// on these projects. The tests keep the toolchain's level.
tasks.named('compileJava', JavaCompile) {
    options.release = 17
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
}
