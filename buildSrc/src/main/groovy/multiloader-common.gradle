plugins {
    id 'java-library'
}

// Applied to the Stonecutter nodes (ADR-165): this project is :<platform>:<minecraft
// version>, built from the sources of its branch, :<platform>.
ext.platform = project.parent.name
ext.branchDir = project.parent.projectDir
// The nodes of one version share their name (1.21.1): a group per platform keeps
// :common:1.21.1 and :fabric:1.21.1 apart as Gradle modules.
group = "${rootProject.group}.${platform}"
def modGroup = rootProject.group

// True when this node's Minecraft version is at least `version` (Stonecutter's comparison).
ext.mcAtLeast = { String version -> stonecutter.compare(minecraft_version as String, version) >= 0 }

// A dev run dir of this node: the branch's own for 1.21.1 (fabric/runs/client, neoforge/run),
// runs/<version>/ of the branch for another version, so each version upgrades its own worlds.
ext.versionedRunDir = { String path ->
    minecraft_version == '1.21.1' ? new File(branchDir, path)
            : new File(branchDir, "runs/${minecraft_version}/${path - ~/^runs\//}")
}

// Code and resources of this Minecraft version alone (ADR-165): a file that differs as a
// whole between versions (a mixin on a class the game rewrote, a mixin config) lives in
// src/versioned/<minecraft version>/ of the branch, one copy per version, never in
// Stonecutter comments.
sourceSets.main.java.srcDir(new File(branchDir, "src/versioned/${minecraft_version}/java"))
sourceSets.main.resources.srcDir(new File(branchDir, "src/versioned/${minecraft_version}/resources"))

base {
    archivesName = "${mod_id}-${platform}-${minecraft_version}"
    // Every version's jars in the branch's build/libs (fabric/build/libs/farfield-fabric-
    // <minecraft>-<version>.jar), where CI and the release look for them.
    libsDirectory = new File(branchDir, 'build/libs')
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
}

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven {
                name = 'Sponge'
                url = 'https://repo.spongepowered.org/repository/maven-public'
            }
        }
        filter { includeGroupAndSubgroups('org.spongepowered') }
    }
    exclusiveContent {
        forRepositories(
                maven {
                    name = 'ParchmentMC'
                    url = 'https://maven.parchmentmc.org/'
                },
                maven {
                    name = 'NeoForge'
                    url = 'https://maven.neoforged.net/releases'
                }
        )
        filter { includeGroup('org.parchmentmc.data') }
    }
    // Iris, compiled against for the shader pack path (ADR-113), never bundled.
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup('maven.modrinth') }
    }
}

// Capabilities let the loader projects depend on 'common' without clashing
// with their own outgoing variants.
['apiElements', 'runtimeElements', 'sourcesElements'].each { variant ->
    configurations."$variant".outgoing {
        capability("$modGroup:${base.archivesName.get()}:$version")
        capability("$modGroup:$mod_id-${platform}-${minecraft_version}:$version")
        capability("$modGroup:$mod_id:$version")
    }
}

jar {
    // LGPL-3.0 (ADR-067): the license and the GPL it supplements ship with every jar.
    from(rootProject.file('LICENSE')) { rename { "LICENSE_${mod_id}" } }
    from(rootProject.file('COPYING')) { rename { "COPYING_${mod_id}" } }
    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : project.jar.archiveVersion,
                'Implementation-Title'  : platform,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_author,
                'Built-On-Minecraft'    : minecraft_version
        ])
    }
}

processResources {
    var expandProps = [
            'version'                      : version,
            'group'                        : modGroup, // else the task's group
            'minecraft_version'            : minecraft_version,
            'minecraft_version_range'      : minecraft_version_range,
            'fabric_version'               : fabric_version,
            'fabric_loader_version'        : fabric_loader_version,
            'fabric_loader_min'            : fabric_loader_min,
            'mod_name'                     : mod_name,
            'mod_author'                   : mod_author,
            'mod_id'                       : mod_id,
            'license'                      : license,
            'description'                  : project.description,
            'neoforge_version'             : neoforge_version,
            'neoforge_version_range'       : neoforge_version_range,
            'neoforge_loader_version_range': neoforge_loader_version_range,
            'credits'                      : credits,
            'java_version'                 : java_version
    ]

    filesMatching(['pack.mcmeta', 'fabric.mod.json', 'META-INF/neoforge.mods.toml', '*.mixins.json']) {
        expand expandProps
    }
    inputs.properties(expandProps)
}

// Every compile error of a port at once, not javac's first 100 (ADR-165).
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Xmaxerrs', '5000']
}
