plugins {
    id 'multiloader-common'
}

configurations {
    commonJava {
        canBeResolved = true
    }
    commonResources {
        canBeResolved = true
    }
}

dependencies {
    compileOnly(project(':common')) {
        capabilities {
            requireCapability "$group:$mod_id"
        }
    }
    // The mod jar is built from the sources of api, core and common plus the
    // loader's own: one jar per loader, no nested jars for our own code.
    commonJava project(path: ':api', configuration: 'commonJava')
    commonJava project(path: ':core', configuration: 'commonJava')
    commonJava project(path: ':common', configuration: 'commonJava')
    commonResources project(path: ':common', configuration: 'commonResources')
}

tasks.named('compileJava', JavaCompile) {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
}

processResources {
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
}

tasks.named('sourcesJar', Jar) {
    dependsOn(configurations.commonJava)
    from(configurations.commonJava)
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
}

// Dev run dirs (ADR-042): runClient and runServer first copy the missing
// files of dev/client and dev/server into the run dirs. Each loader calls
// this with its own run dirs.
ext.registerPrepareRuns = { File clientDir, File serverDir ->
    def prepareRuns = tasks.register('prepareRuns') {
        group = 'farfield'
        description = 'Copies the missing dev/ templates into the dev run dirs.'
        doLast {
            [(rootProject.file('dev/client')): clientDir, (rootProject.file('dev/server')): serverDir].each { from, into ->
                DevTemplates.copyMissing(from, into).each {
                    logger.lifecycle("Created ${project.relativePath(it)} from dev/")
                }
            }
        }
    }
    tasks.matching { it.name in ['runClient', 'runServer'] }.configureEach {
        dependsOn prepareRuns
    }
}
