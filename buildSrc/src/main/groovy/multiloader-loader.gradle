plugins {
    id 'multiloader-common'
}

configurations {
    commonJava {
        canBeResolved = true
    }
    commonResources {
        canBeResolved = true
    }
}

dependencies {
    compileOnly(project(':common')) {
        capabilities {
            requireCapability "$group:$mod_id"
        }
    }
    // The mod jar is built from the sources of api, core and common plus the
    // loader's own: one jar per loader, no nested jars for our own code.
    commonJava project(path: ':api', configuration: 'commonJava')
    commonJava project(path: ':core', configuration: 'commonJava')
    commonJava project(path: ':common', configuration: 'commonJava')
    commonResources project(path: ':common', configuration: 'commonResources')
}

tasks.named('compileJava', JavaCompile) {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
}

processResources {
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
}

tasks.named('sourcesJar', Jar) {
    dependsOn(configurations.commonJava)
    from(configurations.commonJava)
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
}

// Dev run dirs (ADR-042): runClient and runServer first copy the missing
// files of dev/client and dev/server into the run dirs. Each loader calls
// this with its own run dirs.
ext.registerPrepareRuns = { File clientDir, File serverDir ->
    def prepareRuns = tasks.register('prepareRuns') {
        group = 'farfield'
        description = 'Copies the missing dev/ templates into the dev run dirs.'
        doLast {
            [(rootProject.file('dev/client')): clientDir, (rootProject.file('dev/server')): serverDir].each { from, into ->
                DevTemplates.copyMissing(from, into).each {
                    logger.lifecycle("Created ${project.relativePath(it)} from dev/")
                }
            }
        }
    }
    tasks.matching { it.name in ['runClient', 'runServer'] }.configureEach {
        dependsOn prepareRuns
    }
}

// -PfreshWorld with -PquickPlay=<save>: the run starts again from the template
// world of dev/client/saves, its LOD store included, so an agent replays a
// flight over terrain that was never generated (ADR-097). Only saves that have
// a template are deleted; the others would be lost for good.
ext.registerFreshWorld = { String runTaskName, File clientDir ->
    if (!project.hasProperty('freshWorld') || !project.hasProperty('quickPlay')) {
        return
    }
    String save = project.property('quickPlay') as String
    File template = rootProject.file("dev/client/saves/${save}")
    if (!(save ==~ /[A-Za-z0-9._ -]+/) || save.startsWith('.') || !template.directory) {
        throw new GradleException("-PfreshWorld needs a save with a template in dev/client/saves, not '${save}'")
    }
    def fresh = tasks.register("freshWorldFor${runTaskName.capitalize()}") {
        group = 'farfield'
        description = "Deletes saves/${save} of ${project.relativePath(clientDir)} so it starts from the template."
        doLast {
            File dir = new File(clientDir, "saves/${save}")
            if (dir.exists()) {
                project.delete(dir)
                logger.lifecycle("Deleted ${project.relativePath(dir)}: the run starts from the template world")
            }
        }
    }
    tasks.matching { it.name == runTaskName }.configureEach { dependsOn fresh }
    tasks.matching { it.name in ['prepareRuns', 'syncPackInstance', 'syncPackMods'] }.configureEach { mustRunAfter fresh }
}
