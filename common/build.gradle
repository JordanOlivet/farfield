plugins {
    id 'multiloader-common'
}

// 1.20.1 has no NeoForm: the legacy plugin gives the game in Mojang's names from MCP.
def legacy = project.hasProperty('mcp_version')
apply plugin: legacy ? 'net.neoforged.moddev.legacyforge' : 'net.neoforged.moddev'

(legacy ? legacyForge : neoForge).with {
    if (legacy) {
        mcpVersion = mcp_version
    } else {
        neoFormVersion = neo_form_version
    }
    // Automatically enable AccessTransformers if the file exists
    def at = new File(branchDir, 'src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    // Parameter names from Parchment while the game is obfuscated (before 26.1, ADR-171).
    if (project.hasProperty('parchment_version')) {
        parchment {
            minecraftVersion = parchment_minecraft
            mappingsVersion = parchment_version
        }
    }
}

dependencies {
    api project(':core')
    compileOnly group: 'org.spongepowered', name: 'mixin', version: '0.8.5'
    // The mixin config plugin's interface names ASM's ClassNode (the Iris mixins, ADR-113).
    compileOnly group: 'org.ow2.asm', name: 'asm-tree', version: '9.7.1'
    // fabric and neoforge both bundle mixinextras, so it is safe to use it in common
    compileOnly group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.3.5'
    annotationProcessor group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.3.5'
    // Shader packs (ADR-113): Iris's NeoForge jar is Mojang-named, as common is.
    // 1.20.1: Oculus, Iris's Forge port, SRG-named and remapped to Mojang's names here.
    if (project.hasProperty('oculus_version')) {
        modCompileOnly("maven.modrinth:oculus:${oculus_version}") { transitive = false }
    }
    if (project.hasProperty('iris_neoforge_version')) {
        compileOnly("maven.modrinth:iris:${iris_neoforge_version}") { transitive = false }
    }
    // Sodium's video settings pages (Sodium 0.8 on): its NeoForge API jar is Mojang-named, as common is.
    if (project.hasProperty('sodium_api_version')) {
        compileOnly("net.caffeinemc:sodium-neoforge-api:${sodium_api_version}") { transitive = false }
    }
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

// The sources of this Minecraft version, as Stonecutter gives them (ADR-165): the
// branch's src/ for the active version, its generated copy for another. Synced to
// one folder each, which the loader nodes compile and package.
def syncCommonJava = tasks.register('syncCommonJava', Sync) {
    from(sourceSets.main.java)
    into(layout.buildDirectory.dir('common/java'))
}
def syncCommonResources = tasks.register('syncCommonResources', Sync) {
    from(sourceSets.main.resources)
    into(layout.buildDirectory.dir('common/resources'))
}

artifacts {
    commonJava(syncCommonJava.map { it.destinationDir }) { builtBy syncCommonJava }
    commonResources(syncCommonResources.map { it.destinationDir }) { builtBy syncCommonResources }
}
