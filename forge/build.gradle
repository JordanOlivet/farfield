plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev.legacyforge'
}

// Minecraft 1.20.1 on Forge 47 (ADR-177): NeoForge for 1.20.1 is Forge's 47.1 fork and
// loads this jar. ModDevGradle's legacy plugin: the game in Mojang's names for the dev
// runs, the jar reobfuscated to SRG names with a mixin refmap, as Forge 47 needs.

legacyForge {
    version = "${minecraft_version}-${forge_version}"
    if (project.hasProperty('parchment_version')) {
        parchment {
            minecraftVersion = parchment_minecraft
            mappingsVersion = parchment_version
        }
    }
    runs {
        configureEach {
            ideName = "Forge ${it.name.capitalize()} (${project.path})"
            // Dev runs log the performance lines (off by default in play).
            systemProperty('farfield.perfLogs', 'true')
        }
        client {
            client()
            gameDirectory = versionedRunDir('run')
            // Rehearsal, the test harness mod (ADR-122), when its jar is there.
            systemProperty('rehearsal', 'true')
            systemProperty('rehearsal.extensions', 'io.lakio.farfield.client.FarfieldRehearsal')
            if (project.hasProperty('agentWindow')) {
                systemProperty('rehearsal.window', project.property('agentWindow') as String)
            }
            if (project.hasProperty('quickPlay')) {
                programArguments.addAll('--quickPlaySingleplayer', project.property('quickPlay') as String)
            }
            if (project.hasProperty('quickPlayServer')) {
                programArguments.addAll('--quickPlayMultiplayer', project.property('quickPlayServer') as String)
            }
            if (project.hasProperty('clientUsername')) {
                programArguments.addAll('--username', project.property('clientUsername') as String)
            }
        }
        server {
            server()
            // A folder of its own: a dev client joining it (streaming checks) would
            // otherwise share its logs/latest.log.
            gameDirectory = versionedRunDir('server')
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

// Forge 47 reads the mixin configs from the jar's manifest, and the remapped jar's
// mixins find their targets through the refmap the annotation processor writes.
mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
    config "${mod_id}.iris.mixins.json"
    config "${mod_id}.sodium.mixins.json"
    config "${mod_id}.forge.mixins.json"
}

def mixinConfigs = ["${mod_id}.mixins.json", "${mod_id}.iris.mixins.json", "${mod_id}.sodium.mixins.json",
        "${mod_id}.forge.mixins.json"]
jar {
    manifest.attributes('MixinConfigs': mixinConfigs.join(','))
}
// The shippable jar is the reobfuscated one. The legacy plugin writes it to the node's
// own build/libs; it goes to the branch's (forge/build/libs), where CI and the release
// look for every loader's jars.
tasks.named('reobfJar') {
    destinationDirectory = base.libsDirectory
}
// Each config names the refmap (Forge only: Loom and NeoForge need none).
processResources {
    inputs.property('refmap', "${mod_id}.refmap.json")
    filesMatching('*.mixins.json') {
        filter { String line ->
            line.contains('"package"') ? "${line}\n  \"refmap\": \"${mod_id}.refmap.json\"," : line
        }
    }
}

dependencies {
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    // MixinExtras (@Local): Forge 47 does not ship it, so the jar nests it.
    compileOnly(annotationProcessor('io.github.llamalad7:mixinextras-common:0.3.5'))
    implementation(jarJar('io.github.llamalad7:mixinextras-forge:0.3.5'))
    // Libraries of the engine core, nested in the mod jar.
    jarJar(implementation("io.airlift:aircompressor")) {
        version {
            strictly "[${aircompressor_version},)"
            prefer aircompressor_version
        }
    }
    additionalRuntimeClasspath "io.airlift:aircompressor:${aircompressor_version}"
    // Shader packs (ADR-113): Oculus, Iris's Forge port, compiled against, never bundled.
    modCompileOnly("maven.modrinth:oculus:${oculus_version}") { transitive = false }
    // Rehearsal, the test harness mod (ADR-122), in the dev runs only, when a checkout is named.
    // Its jar is reobfuscated (SRG names) and the dev run is in Mojang's names, so it goes
    // through modRuntimeOnly to be remapped, which takes module coordinates, not a file:
    // its output/ folder is a flat repository.
    def rehearsalJar = rehearsalJar('forge')
    if (rehearsalJar != null) {
        // rehearsal-forge-<mc>-<version>.jar: the remapping needs a version.
        modRuntimeOnly "rehearsal:rehearsal-forge:${rehearsalJar.name - 'rehearsal-forge-' - '.jar'}"
    }
}
if (rehearsalJar('forge') != null) {
    repositories {
        flatDir {
            name = 'RehearsalOutput'
            dirs rehearsalJar('forge').parentFile
            content { includeGroup 'rehearsal' }
        }
    }
}

registerPrepareRuns(versionedRunDir('run'), versionedRunDir('server'))

// An agent's run (-PagentWindow) goes without FML's loading window, which takes the focus
// before any mod code runs (ADR-096); Forge 47 has the same window and key as NeoForge.
// fml.toml is put back once the game exits. -PearlyWindow keeps it.
if (project.hasProperty('agentWindow') && !project.hasProperty('earlyWindow')) {
    def runDir = versionedRunDir('run')
    def fmlConfig = new File(runDir, 'config/fml.toml')
    def saved = new File(runDir, 'config/fml.toml.agent-saved')
    def restore = tasks.register('restoreFmlConfigAfterRunClient') {
        doLast {
            if (saved.exists()) {
                fmlConfig.bytes = saved.bytes
                saved.delete()
            }
        }
    }
    tasks.matching { it.name == 'runClient' }.configureEach {
        finalizedBy restore
        doFirst {
            if (fmlConfig.exists()) {
                saved.bytes = fmlConfig.bytes
                fmlConfig.setText(fmlConfig.getText('UTF-8')
                        .replaceAll(/(?m)^earlyWindowControl = true/, 'earlyWindowControl = false'), 'UTF-8')
            } else {
                fmlConfig.parentFile.mkdirs()
                fmlConfig.setText("earlyWindowControl = false${System.lineSeparator()}", 'UTF-8')
            }
        }
    }
}
registerFreshWorld('runClient', versionedRunDir('run'))

// Dev servers read console commands (scripted checks pipe them in).
tasks.matching { it.name == 'runServer' }.configureEach {
    standardInput = System.in
}
