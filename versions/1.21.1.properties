# Minecraft 1.21.1: the properties of this version's build nodes (ADR-165).
# settings.gradle sets them on the common, fabric and neoforge nodes of this
# version; every field used in mod metadata is also listed in the expandProps
# map of buildSrc/src/main/groovy/multiloader-common.gradle.

minecraft_version=1.21.1
minecraft_version_range=[1.21.1, 1.21.2)
## NeoForm version used by the 'common' project: https://projects.neoforged.net/neoforged/neoform
neo_form_version=1.21.1-20240808.144430
## Parchment parameter names: https://parchmentmc.org/docs/getting-started#choose-a-version
parchment_minecraft=1.21
parchment_version=2024.11.10

# Fabric
# The dev runtime: as recent as the user's Fabric pack needs (Cobblemon asks
# Fabric API 0.116.6).
fabric_version=0.116.17+1.21.1
## Mod Menu, optional, opens the settings screen: https://modrinth.com/mod/modmenu/versions
modmenu_version=11.0.3

# NeoForge: the version of the pack runPackClient loads (ADR-097); its Forgified Fabric
# API needs 21.1.248. The shipped jar accepts any 21.1 (neoforge.mods.toml).
neoforge_version=21.1.248
neoforge_version_range=[21.1.0,)

# Iris, compile only (shader packs, ADR-113). Fabric: 1.8.14 needs Loom 1.16 to remap, 1.8.8 has the same API here.
iris_neoforge_version=1.8.14-beta.1+1.21.1-neoforge
iris_fabric_version=1.8.8+1.21.1-fabric

# Sodium config API, compile only (its video settings pages, Sodium 0.8 on).
sodium_api_version=0.8.13+mc1.21.1
