# Minecraft 26.3: the properties of this version's build nodes (ADR-165).
# settings.gradle sets them on the common, fabric and neoforge nodes of this
# version; every field used in mod metadata is also listed in the expandProps
# map of buildSrc/src/main/groovy/multiloader-common.gradle.

minecraft_version=26.3
minecraft_version_range=[26.3, 26.4)
# 26.1 on: the game runs Java 25 and ships unobfuscated, so no Parchment (ADR-171).
java_version=25
## NeoForm version used by the 'common' project: https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.3-1

# Fabric
fabric_version=0.166.2+26.3
## Mod Menu, optional, opens the settings screen: https://modrinth.com/mod/modmenu/versions
modmenu_version=21.0.1

# NeoForge
neoforge_version=26.3.0.113
# NeoForge 26.2 warns about the logoFile key at every start: the square logo is an iconFile.
neoforge_logo_key=iconFile
neoforge_version_range=[26.3.0.0,)

# Iris, compile only (shader packs, ADR-113).
iris_neoforge_version=1.11.7+26.3-neoforge
iris_fabric_version=1.11.7+26.3-fabric

# Sodium config API, compile only (its video settings pages, Sodium 0.8 on).
sodium_api_version=0.9.3-beta.5+mc26.3
