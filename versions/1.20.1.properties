# Minecraft 1.20.1: the properties of this version's build nodes (ADR-165).
# settings.gradle sets them on the common, fabric and forge nodes of this
# version; every field used in mod metadata is also listed in the expandProps
# map of buildSrc/src/main/groovy/multiloader-common.gradle.

minecraft_version=1.20.1
minecraft_version_range=[1.20.1, 1.20.2)
# 1.20.1 runs Java 17, and Forge 47's Mixin knows no JAVA_21 level.
java_version=17
mixin_compatibility_level=JAVA_17
## No NeoForm before 1.20.2: the 'common' project takes MCP's 1.20.1 through
## ModDevGradle's legacy plugin (mcp_version).
mcp_version=1.20.1
## Parchment parameter names: https://parchmentmc.org/docs/getting-started#choose-a-version
parchment_minecraft=1.20.1
parchment_version=2023.09.03

# Fabric
fabric_version=0.92.12+1.20.1
## Mod Menu, optional, opens the settings screen: https://modrinth.com/mod/modmenu/versions
modmenu_version=7.2.2

# Forge. NeoForge for 1.20.1 is the 47.1 fork of Forge (last build May 2024),
# which loads Forge jars: no node of its own.
forge_version=47.4.29
# The shipped jar accepts any Forge 47 (and NeoForge 47.1, its fork).
forge_version_range=[47,)
forge_loader_version_range=[47,)

# NeoForge keys the shared metadata map still reads.
neoforge_version=
neoforge_version_range=

# Iris, compile only (shader packs, ADR-113). Fabric only: Forge packs run Oculus.
iris_fabric_version=1.7.6+1.20.1
# Oculus, Iris's Forge port: what 'common' compiles the shader pack path against.
oculus_version=1.20.1-1.8.0
# No Sodium config API before Sodium 0.8 (1.21.1 on).
