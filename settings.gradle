pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Fabric'
                    url = uri('https://maven.fabricmc.net')
                }
            }
            filter {
                includeGroupAndSubgroups('net.fabricmc')
                includeGroup('fabric-loom')
            }
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Sponge'
                    url = uri('https://repo.spongepowered.org/repository/maven-public')
                }
            }
            filter {
                includeGroupAndSubgroups('org.spongepowered')
            }
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'KikuGie'
                    url = uri('https://maven.kikugie.dev/releases')
                }
            }
            filter {
                includeGroupAndSubgroups('dev.kikugie')
            }
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
    // Several Minecraft versions from one source tree (ADR-165).
    id 'dev.kikugie.stonecutter' version '0.9.8'
}

rootProject.name = 'farfield'

// Machine-specific settings, such as paths outside the repository (ADR-042):
// local.properties, gitignored, see local.properties.example. Its keys become
// project properties; -P on the command line wins.
def localProperties = new Properties()
def localPropertiesFile = file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { localProperties.load(it) }
}
gradle.beforeProject { p ->
    localProperties.each { key, value ->
        if (!p.hasProperty(key as String)) {
            p.ext.set(key as String, value)
        }
    }
}

// Pure Java, no Minecraft: the engine (core) and the public API surface (api),
// built once for every Minecraft version.
include('api')
include('core')

// The Minecraft versions built (ADR-165), `minecraft_versions` in gradle.properties
// (a version being ported is added with -Pminecraft_versions=1.21.1,<version>).
// Each has its properties in versions/<version>.properties.
def minecraftVersions = providers.gradleProperty('minecraft_versions').get().split(',')*.trim()
def versionedProjects = ['common', 'fabric', 'neoforge']

// Minecraft-facing code compiled against vanilla, then one thin project per
// loader, each versioned by Stonecutter: a branch per project, a node per
// Minecraft version (:common:1.21.1 in common/versions/1.21.1), all built by the
// branch's build.gradle from the branch's src/. The root build file is the
// Stonecutter controller, stonecutter.gradle.
stonecutter {
    kotlinController = false
    centralScript = 'build.gradle'
    create(rootProject) { tree ->
        versionedProjects.each { String branch ->
            tree.branch(branch) { it.versions(minecraftVersions as String[]) }
        }
        tree.vcsVersion = '1.21.1'
    }
}

// A node's version properties, set before its build script runs: they win over
// gradle.properties (java_version, 25 from 26.1), -P on the command line and
// local.properties win over them.
def commandLineProperties = gradle.startParameter.projectProperties
gradle.beforeProject { p ->
    if (p.parent != null && p.parent.parent == p.rootProject && p.parent.name in versionedProjects) {
        def file = new File(settingsDir, "versions/${p.name}.properties")
        if (!file.exists()) {
            throw new GradleException("No properties for Minecraft ${p.name}: ${file} is missing")
        }
        def props = new Properties()
        file.withReader('UTF-8') { props.load(it) }
        props.each { key, value ->
            if (!commandLineProperties.containsKey(key) && !localProperties.containsKey(key)) {
                p.ext.set(key as String, value)
            }
        }
    }
}
