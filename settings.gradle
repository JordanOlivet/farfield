pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Fabric'
                    url = uri('https://maven.fabricmc.net')
                }
            }
            filter {
                includeGroup('net.fabricmc')
                includeGroup('fabric-loom')
            }
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Sponge'
                    url = uri('https://repo.spongepowered.org/repository/maven-public')
                }
            }
            filter {
                includeGroupAndSubgroups('org.spongepowered')
            }
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'farfield'

// Machine-specific settings, such as paths outside the repository (ADR-042):
// local.properties, gitignored, see local.properties.example. Its keys become
// project properties; -P on the command line wins.
def localProperties = new Properties()
def localPropertiesFile = file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { localProperties.load(it) }
}
gradle.beforeProject { p ->
    localProperties.each { key, value ->
        if (!p.hasProperty(key as String)) {
            p.ext.set(key as String, value)
        }
    }
}

// Pure Java, no Minecraft: the engine (core) and the public API surface (api).
include('api')
include('core')
// Minecraft-facing code compiled against vanilla, then one thin project per loader.
include('common')
include('fabric')
include('neoforge')
