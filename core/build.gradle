plugins {
    id 'farfield-java'
    id 'me.champeau.jmh' version '0.7.2'
}

dependencies {
    api project(':api')

    // Reference implementation of the LZ4 block stream that region files use
    // (compression type 4), to check our own decoder against it. Tests only.
    testImplementation "org.lz4:lz4-java:${lz4_java_version}"

    // Spike S1 (storage) measurements only: never part of the mod jar. The
    // shipped choice is made by the ADR that closes the spike.
    jmhImplementation "com.github.luben:zstd-jni:${zstd_jni_version}"
    jmhImplementation "org.lmdbjava:lmdbjava:${lmdbjava_version}"
}

jmh {
    jmhVersion = jmh_version
    // Run a subset with -PjmhIncludes=<regex>, e.g. -PjmhIncludes=MeshBenchmark
    if (project.hasProperty('jmhIncludes')) {
        includes = [project.property('jmhIncludes') as String]
    }
    // Comma-separated JMH profilers, e.g. -PjmhProfilers=gc,stack
    if (project.hasProperty('jmhProfilers')) {
        profilers = (project.property('jmhProfilers') as String).split(',').toList()
    }
}

// End-to-end import throughput on a corpus world (spike S5, plan item B.4):
//   gradlew :core:importBench --args="<world or region dir> [--threads N] [--all-status] [--limit-regions N]"
tasks.register('importBench', JavaExec) {
    group = 'benchmark'
    description = 'Runs the multi-threaded region import benchmark on a world folder.'
    classpath = sourceSets.jmh.runtimeClasspath
    mainClass = 'io.lakio.farfield.core.bench.ImportBenchmark'
    // Same JVM as the game on 1.21.1, not the one running Gradle.
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(java_version)
    }
    maxHeapSize = '4g'
}

// Storage measurements on a corpus world (spike S1, plan items D.1 to D.3):
//   gradlew :core:storageBench --args="<world dir> [--threads N] [--containers] [--dict-from <world dir>] ..."
tasks.register('storageBench', JavaExec) {
    group = 'benchmark'
    description = 'Measures LOD storage encoders and containers on a world folder.'
    classpath = sourceSets.jmh.runtimeClasspath
    mainClass = 'io.lakio.farfield.core.bench.StorageBenchmark'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(java_version)
    }
    maxHeapSize = '8g'
    // lmdbjava reaches into NIO buffers.
    jvmArgs '--add-opens', 'java.base/java.nio=ALL-UNNAMED', '--add-opens', 'java.base/sun.nio.ch=ALL-UNNAMED'
}
