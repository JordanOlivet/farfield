name: Release

# Push a tag v<gradle.properties version>[-<pre-release>] (e.g. v0.1.0-alpha.1)
# to build every loader and Minecraft version's jar at that version and publish
# them to Modrinth, CurseForge and a GitHub Release (ADR-031, ADR-165). Needs the
# repository variables MODRINTH_ID and CURSEFORGE_ID and the secrets
# MODRINTH_TOKEN and CURSEFORGE_TOKEN.
#
# One target per loader and Minecraft version, each with its game version and a
# version suffix of its own (Modrinth refuses one version number twice): a
# Minecraft version added to minecraft_versions in gradle.properties gets two
# targets here. 26.x targets declare Java 25 (ADR-171), the 1.20.1 ones Java 17
# (ADR-177); Gradle itself runs on the Java 25 of gradle/gradle-daemon-jvm.properties
# whatever JDK starts it.
#
# 1.20.1 has a Forge jar and no NeoForge one (ADR-177): NeoForge for 1.20.1 is the
# 47.1 fork of Forge and loads the Forge jar, so that file carries both loaders.

on:
  push:
    tags: ['v*']

jobs:
  publish:
    permissions:
      contents: write
    uses: JordanOlivet/ci-workflows/.github/workflows/publish-mod.yml@v1
    with:
      tag: ${{ github.ref_name }}
      mod-name: Farfield
      java-versions: 21
      modrinth-id: ${{ vars.MODRINTH_ID }}
      curseforge-id: ${{ vars.CURSEFORGE_ID }}
      targets: >-
        [{"loader":"forge neoforge","label":"Forge 1.20.1","files":"forge/build/libs/farfield-forge-1.20.1-*.jar",
          "game-versions":"1.20.1","java-versions":"17","version-suffix":"forge-1.20.1"},
         {"loader":"fabric","label":"Fabric 1.20.1","files":"fabric/build/libs/farfield-fabric-1.20.1-*.jar",
          "game-versions":"1.20.1","java-versions":"17","version-suffix":"fabric-1.20.1"},
         {"loader":"neoforge","label":"NeoForge 1.21.1","files":"neoforge/build/libs/farfield-neoforge-1.21.1-*.jar",
          "game-versions":"1.21.1","version-suffix":"neoforge-1.21.1"},
         {"loader":"fabric","label":"Fabric 1.21.1","files":"fabric/build/libs/farfield-fabric-1.21.1-*.jar",
          "game-versions":"1.21.1","version-suffix":"fabric-1.21.1"},
         {"loader":"neoforge","label":"NeoForge 1.21.11","files":"neoforge/build/libs/farfield-neoforge-1.21.11-*.jar",
          "game-versions":"1.21.11","version-suffix":"neoforge-1.21.11"},
         {"loader":"fabric","label":"Fabric 1.21.11","files":"fabric/build/libs/farfield-fabric-1.21.11-*.jar",
          "game-versions":"1.21.11","version-suffix":"fabric-1.21.11"},
         {"loader":"neoforge","label":"NeoForge 26.1.2","files":"neoforge/build/libs/farfield-neoforge-26.1.2-*.jar",
          "game-versions":"26.1.2","java-versions":"25","version-suffix":"neoforge-26.1.2"},
         {"loader":"fabric","label":"Fabric 26.1.2","files":"fabric/build/libs/farfield-fabric-26.1.2-*.jar",
          "game-versions":"26.1.2","java-versions":"25","version-suffix":"fabric-26.1.2"},
         {"loader":"neoforge","label":"NeoForge 26.2","files":"neoforge/build/libs/farfield-neoforge-26.2-*.jar",
          "game-versions":"26.2","java-versions":"25","version-suffix":"neoforge-26.2"},
         {"loader":"fabric","label":"Fabric 26.2","files":"fabric/build/libs/farfield-fabric-26.2-*.jar",
          "game-versions":"26.2","java-versions":"25","version-suffix":"fabric-26.2"},
         {"loader":"neoforge","label":"NeoForge 26.3","files":"neoforge/build/libs/farfield-neoforge-26.3-*.jar",
          "game-versions":"26.3","java-versions":"25","version-suffix":"neoforge-26.3"},
         {"loader":"fabric","label":"Fabric 26.3","files":"fabric/build/libs/farfield-fabric-26.3-*.jar",
          "game-versions":"26.3","java-versions":"25","version-suffix":"fabric-26.3"}]
    secrets:
      modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
      curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
